name: Collect X data (weekly, Fridays 6 AM Central)
 
on:
  schedule:
    - cron: "7 6 * * 5"
      timezone: "America/Chicago"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
permissions:
  contents: write
  pages: write
 
concurrency:
  group: collect-data
  cancel-in-progress: false
 
jobs:
  collect-x:
    runs-on: ubuntu-24.04
    steps:
      - name: Accept scheduled or manual collection
        id: gate
        run: |
          # The schedule selects Friday at 6:07 AM Central. GitHub can start it
          # later than requested, so accept the scheduled event regardless of delay.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Proceeding with ${{ github.event_name }} at $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')."
 
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
 
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
 
      - name: Collect X/Twitter followers (all accounts)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x.py
 
      - name: Collect X/Twitter views and engagement (all accounts)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x_metrics.py
 
      - name: Save results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "follower-bot"
          git config user.email "follower-bot@users.noreply.github.com"
          git add followers.csv
          [ -f metrics.csv ] && git add metrics.csv || true
          git diff --staged --quiet || git commit -m "X snapshot $(TZ=America/Chicago date +%F)"
          git pull --rebase --autostash
          git push
 
      - name: Refresh the dashboard site
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
