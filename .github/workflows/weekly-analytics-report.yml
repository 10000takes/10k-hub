name: Weekly Analytics Report

on:
  schedule:
    # Run at 8:00 AM America/Chicago on Friday (DST / standard time).
    - cron: "0 13 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview creates the PDF only; Send and Resend email it
        type: choice
        options: [preview, send, resend]
        default: preview
      report_date:
        description: Optional end-capture date (YYYY-MM-DD)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-analytics-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Friday morning schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$(TZ=America/Chicago date +%u)" = "5" ] && [ "$(TZ=America/Chicago date +%H)" = "08" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not Friday at 8 AM Central; skipping report generation and email."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install PDF renderer
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install reportlab

      - name: Generate weekly report
        if: steps.gate.outputs.run == 'true'
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=(--force)
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          python scripts/generate_weekly_analytics_report.py generate "${args[@]}"

      - name: Save report before delivery
        if: ${{ steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/content-report-data/weekly-reports .github/content-report-data/snapshots
          if git diff --cached --quiet; then
            echo "Weekly report snapshot already persisted."
          else
            git commit -m "Save weekly analytics report"
            git pull --rebase --autostash
            git push
          fi

      - name: Email weekly report using Resend
        if: ${{ steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          WEEKLY_CONTENT_REPORT_TO: 10000takes@gmail.com
          REPORT_DATE: ${{ inputs.report_date }}
          AUTHORIZED_RESEND: ${{ inputs.mode == 'resend' }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          if [ "$AUTHORIZED_RESEND" = "true" ]; then args+=(--authorized-resend); fi
          python scripts/generate_weekly_analytics_report.py deliver "${args[@]}"

      - name: Persist delivery status
        if: ${{ always() && steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/content-report-data/weekly-reports
          if git diff --cached --quiet; then
            echo "Delivery state already persisted."
          else
            git commit -m "Record weekly analytics delivery status"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: 10K-Takes-Weekly-Analytics
          path: .github/content-report-data/weekly-reports/**
          if-no-files-found: error
          retention-days: 90
