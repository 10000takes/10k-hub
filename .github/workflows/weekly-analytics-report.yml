name: Weekly Analytics Report

on:
  schedule:
    # Run at 9:00 AM America/Chicago on Friday, after the 6 AM X collector.
    - cron: "0 9 * * 5"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview creates the PDF only; Send and Resend email it
        type: choice
        options: [preview, send, resend]
        default: preview
      report_date:
        description: Optional end-capture date (YYYY-MM-DD)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-analytics-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check Friday morning schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$(TZ=America/Chicago date +%u)" = "5" ] && [ "$(TZ=America/Chicago date +%H)" = "09" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not Friday at 9 AM Central; skipping report generation and email."
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Confirm today's X metrics are saved
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import csv, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("America/Chicago")).date().isoformat()
          try:
              with open("metrics.csv", newline="", encoding="utf-8-sig") as source:
                  rows = csv.DictReader(source)
                  ready = any(r.get("date") == day and r.get("account") == "10K Takes"
                              and r.get("platform") == "X/Twitter" and r.get("metric") == "views_7d"
                              and r.get("value", "").strip() for r in rows)
          except OSError:
              ready = False
          if not ready:
              sys.exit("X/Twitter metrics were not saved for today. Stopping so the scheduled report cannot email stale X numbers; check the Collect X workflow and retry.")
          print("Fresh X/Twitter metrics found for " + day)
          PY

      - name: Check whether today's post snapshot needs a refresh
        id: posts
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.report_date == '')
        run: |
          day=$(TZ=America/Chicago date +%F)
          if [ -f ".github/content-report-data/snapshots/$day.json" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "A current saved post snapshot is already available."
          elif python -c 'import csv,sys
          try: f=open("top_posts.csv",newline="",encoding="utf-8-sig")
          except OSError: sys.exit(1)
          sys.exit(not any(r.get("snapshot","").strip()==sys.argv[1] for r in csv.DictReader(f)))' "$day"; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Today's post collector data is already available; it will be saved as a report snapshot."
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "No current post snapshot; refresh recent posts before reporting."
          fi

      - name: Prepare main Meta Page credential
        if: steps.gate.outputs.run == 'true' && steps.posts.outputs.refresh == 'true'
        continue-on-error: true
        env:
          FACEBOOK_SYSTEM_USER_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/prepare_meta_token.py

      - name: Refresh recent main-account posts
        if: steps.gate.outputs.run == 'true' && steps.posts.outputs.refresh == 'true'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          THREADS_ACCESS_TOKEN_10K_TAKES: ${{ secrets.THREADS_ACCESS_TOKEN_10K_TAKES }}
        run: python collect_top_posts.py

      - name: Refresh TikTok main-account posts
        if: steps.gate.outputs.run == 'true' && steps.posts.outputs.refresh == 'true'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_10K_TAKES: ${{ secrets.TIKTOK_REFRESH_TOKEN_10K_TAKES }}
        run: python collect_tiktok.py --top-posts-only

      - name: Save current post snapshot
        if: steps.gate.outputs.run == 'true' && steps.posts.outputs.refresh == 'true'
        run: python scripts/generate_daily_content_report.py snapshot --force

      - name: Install PDF renderer
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install reportlab

      - name: Generate weekly report
        if: steps.gate.outputs.run == 'true'
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=(--force)
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          python scripts/generate_weekly_analytics_report.py generate "${args[@]}"

      - name: Save report before delivery
        if: ${{ steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top_posts.csv .github/content-report-data/weekly-reports .github/content-report-data/snapshots
          if git diff --cached --quiet; then
            echo "Weekly report snapshot already persisted."
          else
            git commit -m "Save weekly analytics report"
            git pull --rebase --autostash
            git push
          fi

      - name: Email weekly report using Resend
        if: ${{ steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          WEEKLY_CONTENT_REPORT_TO: 10000takes@gmail.com
          REPORT_DATE: ${{ inputs.report_date }}
          AUTHORIZED_RESEND: ${{ inputs.mode == 'resend' }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          if [ "$AUTHORIZED_RESEND" = "true" ]; then args+=(--authorized-resend); fi
          python scripts/generate_weekly_analytics_report.py deliver "${args[@]}"

      - name: Persist delivery status
        if: ${{ always() && steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'send' || inputs.mode == 'resend') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/content-report-data/weekly-reports
          if git diff --cached --quiet; then
            echo "Delivery state already persisted."
          else
            git commit -m "Record weekly analytics delivery status"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-artifact@v6
        if: steps.gate.outputs.run == 'true'
        with:
          name: 10K-Takes-Weekly-Analytics
          path: .github/content-report-data/weekly-reports/**
          if-no-files-found: error
          retention-days: 90
