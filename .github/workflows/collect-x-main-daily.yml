name: Collect main X followers daily

on:
  schedule:
    - cron: "7 6 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect-main-x:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect 10K Takes follower count only
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect_x.py --main-account-only

      - name: Save main-account snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.csv
          if git diff --cached --quiet; then
            echo "No follower-count change to save."
          else
            git commit -m "Save daily main X follower snapshot $(TZ=America/Chicago date +%F)"
            git pull --rebase --autostash
            git push
          fi

      - name: Refresh dashboard data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
